    <p id="cap-l1-0" class="clip cap" data-start="0.500" data-duration="2.160"><span>This is one Armenian sentence.</span></p>
    <p id="cap-l2-0" class="clip cap" data-start="6.810" data-duration="2.306"><span>And this is the same sentence,</span></p>
    <p id="cap-l2-1" class="clip cap" data-start="9.116" data-duration="1.934"><span>over a mobile phone line.</span></p>
    <p id="cap-l3-0" class="clip cap" data-start="19.010" data-duration="1.749"><span>The best free Armenian model</span></p>
    <p id="cap-l3-1" class="clip cap" data-start="20.759" data-duration="2.171"><span>gets eleven of sixteen words wrong.</span></p>
    <p id="cap-l4-0" class="clip cap" data-start="23.830" data-duration="1.900"><span>Many older people in Armenia</span></p>
    <p id="cap-l4-1" class="clip cap" data-start="25.730" data-duration="1.376"><span>speak only Armenian.</span></p>
    <p id="cap-l4-2" class="clip cap" data-start="27.106" data-duration="2.031"><span>When clinics answer calls with</span></p>

    <p id="cap-l4-4" class="clip cap" data-start="30.316" data-duration="1.834"><span>these callers get misheard.</span></p>

    <p id="cap-l5-1" class="clip cap" data-start="34.064" data-duration="1.769"><span>a narrow slice of the voice.</span></p>
    <p id="cap-l5-2" class="clip cap" data-start="35.832" data-duration="1.830"><span>Nobody had measured what that</span></p>
    <p id="cap-l5-3" class="clip cap" data-start="37.662" data-duration="1.098"><span>does to Armenian.</span></p>
    <p id="cap-l6-0" class="clip cap" data-start="39.660" data-duration="2.081"><span>We tested five free models</span></p>

    <p id="cap-l6-2" class="clip cap" data-start="43.590" data-duration="2.389"><span>The default Whisper model that</span></p>
    <p id="cap-l6-3" class="clip cap" data-start="45.979" data-duration="1.926"><span>most apps use does worse</span></p>
    <p id="cap-l6-4" class="clip cap" data-start="47.905" data-duration="2.235"><span>than writing nothing at all.</span></p>
    <p id="cap-l7-0" class="clip cap" data-start="51.040" data-duration="2.133"><span>So we built Lsir: listen,</span></p>

    <p id="cap-l8-0" class="clip cap" data-start="54.590" data-duration="1.136"><span>Pick a sentence,</span></p>

    <p id="cap-l8-2" class="clip cap" data-start="57.196" data-duration="2.205"><span>line our model never trained on,</span></p>
    <p id="cap-l8-3" class="clip cap" data-start="59.401" data-duration="0.869"><span>and compare.</span></p>
    <p id="cap-l9-0" class="clip cap" data-start="60.870" data-duration="1.898"><span>The original model:</span></p>
    <p id="cap-l9-1" class="clip cap" data-start="62.768" data-duration="3.036"><span>eleven words wrong. Lsir: five.</span></p>
    <p id="cap-l9-2" class="clip cap" data-start="65.804" data-duration="3.226"><span>Both answer in about two seconds.</span></p>
    <p id="cap-l10-0" class="clip cap" data-start="70.030" data-duration="1.471"><span>Lsir is that same model</span></p>
    <p id="cap-l10-1" class="clip cap" data-start="71.501" data-duration="1.471"><span>with a small adapter on</span></p>
    <p id="cap-l10-2" class="clip cap" data-start="72.972" data-duration="1.410"><span>the part that listens:</span></p>
    <p id="cap-l10-3" class="clip cap" data-start="74.381" data-duration="1.410"><span>one and a half percent</span></p>
    <p id="cap-l10-4" class="clip cap" data-start="75.791" data-duration="0.981"><span>of its weights,</span></p>
    <p id="cap-l10-5" class="clip cap" data-start="76.772" data-duration="1.716"><span>trained with half the clips</span></p>
