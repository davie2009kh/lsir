    <p id="cap-l1-0" class="clip cap" data-start="0.500" data-duration="2.220"><span>This is one Armenian sentence.</span></p>
    <p id="cap-l2-0" class="clip cap" data-start="6.870" data-duration="2.464"><span>And this is the same sentence,</span></p>
    <p id="cap-l2-1" class="clip cap" data-start="9.334" data-duration="2.066"><span>over a mobile phone line.</span></p>
    <p id="cap-l3-0" class="clip cap" data-start="19.360" data-duration="2.021"><span>The best free Armenian model</span></p>
    <p id="cap-l3-1" class="clip cap" data-start="21.381" data-duration="2.509"><span>gets eleven of sixteen words wrong.</span></p>
    <p id="cap-l4-0" class="clip cap" data-start="24.790" data-duration="1.738"><span>Many older people in Armenia</span></p>
    <p id="cap-l4-1" class="clip cap" data-start="26.528" data-duration="1.258"><span>speak only Armenian.</span></p>
    <p id="cap-l4-2" class="clip cap" data-start="27.786" data-duration="1.858"><span>When clinics answer calls with</span></p>
    <p id="cap-l4-3" class="clip cap" data-start="29.644" data-duration="1.079"><span>voice assistants,</span></p>
    <p id="cap-l4-4" class="clip cap" data-start="30.722" data-duration="1.678"><span>these callers get misheard.</span></p>

    <p id="cap-l5-1" class="clip cap" data-start="34.658" data-duration="2.185"><span>a narrow slice of the voice.</span></p>
    <p id="cap-l5-2" class="clip cap" data-start="36.843" data-duration="2.260"><span>Nobody had measured what that</span></p>
    <p id="cap-l5-3" class="clip cap" data-start="39.104" data-duration="1.356"><span>does to Armenian.</span></p>
    <p id="cap-l6-0" class="clip cap" data-start="41.360" data-duration="1.892"><span>We tested five free models</span></p>
    <p id="cap-l6-1" class="clip cap" data-start="43.252" data-duration="1.682"><span>on 932 test recordings.</span></p>
    <p id="cap-l6-2" class="clip cap" data-start="44.934" data-duration="2.172"><span>The default Whisper model that</span></p>
    <p id="cap-l6-3" class="clip cap" data-start="47.106" data-duration="1.752"><span>most apps use does worse</span></p>
    <p id="cap-l6-4" class="clip cap" data-start="48.858" data-duration="2.032"><span>than writing nothing at all.</span></p>
    <p id="cap-l7-0" class="clip cap" data-start="51.790" data-duration="1.993"><span>So we built Lsir: listen,</span></p>

    <p id="cap-l8-0" class="clip cap" data-start="55.130" data-duration="1.290"><span>Pick a sentence,</span></p>
    <p id="cap-l8-1" class="clip cap" data-start="56.420" data-duration="1.669"><span>send it down a mobile</span></p>
    <p id="cap-l8-2" class="clip cap" data-start="58.089" data-duration="2.504"><span>line our model never trained on,</span></p>
    <p id="cap-l8-3" class="clip cap" data-start="60.594" data-duration="0.986"><span>and compare.</span></p>
    <p id="cap-l9-0" class="clip cap" data-start="62.180" data-duration="1.321"><span>The original model:</span></p>
    <p id="cap-l9-1" class="clip cap" data-start="63.501" data-duration="2.113"><span>eleven words wrong. Lsir: five.</span></p>
    <p id="cap-l9-2" class="clip cap" data-start="65.614" data-duration="2.246"><span>Both answer in about two seconds.</span></p>
    <p id="cap-l10-0" class="clip cap" data-start="68.860" data-duration="1.770"><span>Lsir is that same model</span></p>
    <p id="cap-l10-1" class="clip cap" data-start="70.630" data-duration="1.770"><span>with a small adapter on</span></p>
    <p id="cap-l10-2" class="clip cap" data-start="72.400" data-duration="1.696"><span>the part that listens:</span></p>
    <p id="cap-l10-3" class="clip cap" data-start="74.096" data-duration="1.696"><span>one and a half percent</span></p>
    <p id="cap-l10-4" class="clip cap" data-start="75.792" data-duration="1.180"><span>of its weights,</span></p>
    <p id="cap-l10-5" class="clip cap" data-start="76.972" data-duration="2.065"><span>trained with half the clips</span></p>
